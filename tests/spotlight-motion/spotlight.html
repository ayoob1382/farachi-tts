<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#11182a;font-family:"Vazirmatn","Vazir","Noto Naskh Arabic",sans-serif}
#stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:#11182a}
svg{width:1920px;height:1080px;position:absolute;inset:0}
#caption{position:absolute;left:160px;right:160px;bottom:58px;min-height:122px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:56px;line-height:1.35;font-weight:800;color:white;text-shadow:0 3px 14px #0009;opacity:0;direction:rtl}
#toplabel{position:absolute;left:70px;top:52px;font-size:24px;color:#aab7d6;letter-spacing:2px;opacity:.7;direction:ltr}
</style></head><body><div id="stage">
<div id="toplabel">FARACHI • MOTION TEST</div>
<svg viewBox="0 0 1920 1080" aria-label="Spotlight metaphor animation">
<defs>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4bd" stop-opacity=".75"/><stop offset="1" stop-color="#ffdb70" stop-opacity=".08"/></linearGradient>
 <radialGradient id="warm"><stop stop-color="#ffca68" stop-opacity=".35"/><stop offset="1" stop-color="#ffca68" stop-opacity="0"/></radialGradient>
 <linearGradient id="bg"><stop stop-color="#202b46"/><stop offset="1" stop-color="#11182a"/></linearGradient>
</defs>
<rect id="bgrect" width="1920" height="1080" fill="url(#bg)"/>
<!-- stage floor and moving parallax decor -->
<g id="room"><path d="M0 810 Q960 710 1920 810 V1080 H0Z" fill="#151f35"/><path d="M0 900 H1920" stroke="#2a3651" stroke-width="3"/><g id="stars" fill="#607096" opacity=".25"><circle cx="120" cy="180" r="3"/><circle cx="1660" cy="220" r="4"/><circle cx="1430" cy="110" r="2"/><circle cx="320" cy="350" r="2"/></g></g>
<!-- crowd in 3 depth layers -->
<g id="crowd">
 <g id="p0" fill="#4b5d83"><circle cx="260" cy="560" r="52"/><rect x="205" y="620" width="110" height="205" rx="42"/></g>
 <g id="p1" fill="#56678d"><circle cx="510" cy="650" r="44"/><rect x="464" y="700" width="92" height="175" rx="34"/></g>
 <g id="p2" fill="#3e4f75"><circle cx="1390" cy="580" r="58"/><rect x="1328" y="646" width="124" height="210" rx="44"/></g>
 <g id="p3" fill="#53648a"><circle cx="1660" cy="660" r="48"/><rect x="1610" y="710" width="100" height="175" rx="36"/></g>
</g>
<!-- thought bubbles and self-focused icons -->
<g id="thoughts" opacity="0"><g fill="#e6edf9" stroke="#8295ba" stroke-width="3">
 <rect x="145" y="260" width="300" height="130" rx="42"/><rect x="435" y="220" width="280" height="150" rx="44"/>
 <rect x="1240" y="250" width="300" height="135" rx="42"/><rect x="1550" y="300" width="260" height="120" rx="42"/>
</g><g fill="#4c5b7d" font-size="34" font-weight="bold" text-anchor="middle"><text x="295" y="335">فکرِ خودم...</text><text x="575" y="308">کارهای امروز</text><text x="1390" y="327">چی بخرم؟</text><text x="1680" y="375">پیام‌ها</text></g></g>
<!-- spotlight -->
<g id="spot"><path id="cone" fill="url(#beam)" d="M960 0 L760 850 L1160 850 Z"/><ellipse id="pool" cx="960" cy="820" rx="300" ry="90" fill="url(#warm)"/></g>
<!-- central character, layered for body/head/arms -->
<g id="hero" transform="translate(0 0)">
 <g id="phone" transform="translate(1040 630) rotate(12)"><rect width="72" height="125" rx="14" fill="#101522" stroke="#8999b8" stroke-width="5"/><rect x="8" y="12" width="56" height="95" rx="6" fill="#7e9fd7"/><circle cx="36" cy="116" r="4" fill="#c2d0e6"/></g>
 <g id="armL"><path d="M900 700 Q820 745 860 800" fill="none" stroke="#f1a36c" stroke-width="38" stroke-linecap="round"/></g>
 <g id="armR"><path d="M1018 700 Q1070 735 1050 800" fill="none" stroke="#f1a36c" stroke-width="38" stroke-linecap="round"/></g>
 <circle id="head" cx="960" cy="520" r="94" fill="#f1a36c"/>
 <path id="hair" d="M870 515 Q875 405 960 420 Q1052 425 1050 530 Q1020 478 984 474 Q930 500 870 515" fill="#252b3e"/>
 <rect id="body" x="865" y="620" width="190" height="260" rx="70" fill="#e37b61"/>
 <g id="eyes" fill="#232a3b"><ellipse cx="930" cy="532" rx="10" ry="16"/><ellipse cx="990" cy="532" rx="10" ry="16"/></g>
 <path id="mouth" d="M936 580 Q960 567 984 580" fill="none" stroke="#7c3f42" stroke-width="7" stroke-linecap="round"/>
</g>
<!-- spotlight moving off and fragments -->
<g id="shards" opacity="0" fill="#ffdb70"><circle cx="800" cy="180" r="10"/><circle cx="1110" cy="260" r="8"/><circle cx="710" cy="420" r="7"/><circle cx="1240" cy="540" r="12"/><circle cx="850" cy="690" r="8"/></g>
<!-- closing graphic -->
<g id="relax" opacity="0"><circle cx="960" cy="510" r="220" fill="none" stroke="#9ed8c5" stroke-width="8" stroke-dasharray="18 20"/><path d="M790 520 Q960 650 1130 520" fill="none" stroke="#9ed8c5" stroke-width="14" stroke-linecap="round"/></g>
</svg>
<div id="caption"></div></div>
<script>
const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
const out=x=>1-ease(x);
let T=null;
fetch('timings.json').then(r=>r.json()).then(j=>{T=j;document.fonts.ready.then(()=>window.ready=true)});
const set=(id,attr,val)=>document.getElementById(id).setAttribute(attr,val);
const tr=(id,x,y,s=1,rot=0)=>set(id,'transform',`translate(${x} ${y}) scale(${s}) rotate(${rot})`);
window.setTime=function(t){
 if(!T)return;const S=T.sentences; const cap=document.getElementById('caption');
 let cur=null;S.forEach(s=>{if(t>=s.start&&t<s.end+.25)cur=s});
 cap.textContent=cur?cur.text:'';cap.style.opacity=cur?ease((t-cur.start)/.22):0;
 const a=ease((t-S[0].start)/.8),aout=out((t-S[1].start)/.6);
 // Beat 1: camera push-in, attention beam snaps down, nervous head turn
 set('hero','transform',`translate(0 ${Math.sin(t*5)*4*a})`);
 set('cone','d',`M960 0 L${960-260*a} 850 L${960+260*a} 850 Z`);
 set('pool','rx',250+100*a);set('pool','opacity',aout);
 set('head','transform',`rotate(${Math.sin(t*3)*8*a} 960 520)`);
 // Beat 2: beam expands like spotlight, camera zoom illusion via scale
 const b=ease((t-S[1].start)/.45), bOut=out((t-S[2].start)/.6);
 set('cone','d',`M960 0 L${960-430*b} 900 L${960+430*b} 900 Z`);
 set('spot','opacity',bOut);set('hero','opacity',1);
 // Beat 3: reveal thoughts, crowd shifts focus to their own bubbles; spotlight fades
 const c=ease((t-S[2].start)/.7);
 set('thoughts','opacity',c);set('crowd','transform',`translate(0 ${-24*c})`);
 set('p0','transform',`rotate(${-5*c} 260 700)`);set('p1','transform',`rotate(${6*c} 510 770)`);
 set('p2','transform',`rotate(${-7*c} 1390 760)`);set('p3','transform',`rotate(${5*c} 1660 770)`);
 // Beat 4: people turn away / attention is elsewhere, hero starts relaxing
 const d=ease((t-S[3].start)/.7);
 set('thoughts','transform',`translate(0 ${-40*d})`);
 set('hero','transform',`translate(0 ${-20*d}) rotate(${-4*d})`);
 set('eyes','opacity',1-d*.65);set('mouth','d',`M936 580 Q960 ${580+14*d} 984 580`);
 // Beat 5: beam collapses into particles, hero drops phone, relaxed smile, graphic resolves
 const e=ease((t-S[4].start)/.55);
 set('spot','opacity',1-e);set('shards','opacity',e);
 set('shards','transform',`translate(${-80*e} ${-180*e}) scale(${1+1.2*e})`);
 set('phone','transform',`translate(${1040+130*e} ${630+100*e}) rotate(${12+55*e})`);
 set('hero','transform',`translate(0 ${-20*d+35*e}) rotate(${-4*d+4*e})`);
 set('relax','opacity',e);set('relax','transform',`scale(${.75+.25*e})`);
 set('mouth','d',`M930 578 Q960 ${590+22*e} 990 578`);
};
</script></body></html>
