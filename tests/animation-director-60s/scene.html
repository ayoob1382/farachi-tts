<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>

</style></head><body><div id="stage"><div id="tag">FARACHI • DIRECTOR TEST</div><svg viewBox="0 0 1920 1080">

<g id="notif"><g fill="#e9f1fb" stroke="#9bb3d5" stroke-width="3"><rect x="300" y="150" width="330" height="110" rx="26"/><rect x="1360" y="180" width="310" height="110" rx="26"/><rect x="270" y="560" width="280" height="100" rx="26"/><rect x="1420" y="620" width="330" height="110" rx="26"/></g><g fill="#27344c" font-size="30" font-weight="bold" text-anchor="middle"><text x="465" y="220">پیام جدید ✦</text><text x="1515" y="250">ویدیوهای پیشنهادی</text><text x="410" y="625">یک اعلان دیگر!</text><text x="1585" y="690">ببین چی اومده</text></g></g>

<g id="tunnel"><g stroke="#e7a65c" stroke-width="8" fill="none" opacity=".65"><ellipse cx="960" cy="510" rx="380" ry="280"/><ellipse cx="960" cy="510" rx="300" ry="220"/><ellipse cx="960" cy="510" rx="220" ry="160"/></g><g id="particles" fill="#f0be73"><circle cx="580" cy="480" r="12"/><circle cx="1320" cy="540" r="9"/><circle cx="800" cy="280" r="8"/><circle cx="1120" cy="760" r="14"/><circle cx="690" cy="730" r="7"/></g></g>

<g id="final"><circle cx="960" cy="510" r="290" fill="none" stroke="#70d4bb" stroke-width="8" stroke-dasharray="14 22"/><path d="M760 520 Q960 680 1160 520" stroke="#70d4bb" stroke-width="12" fill="none" stroke-linecap="round"/></g>
</svg><div id="caption"></div></div>
<script>
const clamp=x=>Math.max(0,Math.min(1,x)),sm=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,x)=>a+(b-a)*x;let T;
fetch('timings.json').then(r=>r.json()).then(j=>{T=j;document.fonts.ready.then(()=>window.ready=true)});
const el=id=>document.getElementById(id),set=(id,p,v)=>el(id).style[p]=v,attr=(id,p,v)=>el(id).setAttribute(p,v);
function phase(i,t){const s=T.sentences[i],n=T.sentences[i+1],end=n?n.start:s.end;return sm((t-s.start)/Math.max(.01,end-s.start))}
window.setTime=t=>{if(!T)return;const S=T.sentences;let active=null;S.forEach((s,i)=>{if(t>=s.start&&t<s.end+.15)active={s,i}});set('caption','opacity',active?sm((t-active.s.start)/.18):0);el('caption').textContent=active?active.s.text:'';const p=S.map((s,i)=>phase(i,t));
['intent','notif','switch','tunnel','tips','final'].forEach(id=>set(id,'opacity','0'));set('homeicons','opacity','1');set('clock','opacity','1');set('video','opacity','0');set('device','opacity','1');set('person','opacity','1');
set('intent','opacity',p[0]);set('intent','transform','translate('+mix(-130,0,p[0])+' '+mix(80,0,p[0])+') scale('+mix(.7,1,p[0])+')');set('person','transform','translate(0 '+mix(70,0,p[0])+') rotate('+mix(8,0,p[0])+')');set('device','transform','translate('+mix(1250,1150,p[0])+' '+mix(500,400,p[0])+') rotate('+mix(18,7,p[0])+')');
set('clock','opacity',1-p[1]);set('homeicons','opacity',p[1]);set('video','opacity',p[1]);set('device','transform','translate('+mix(1150,990,p[1])+' '+mix(400,370,p[1])+') rotate('+mix(7,-9,p[1])+') scale('+mix(1,1.08,p[1])+')');
set('intent','opacity',1-p[2]);set('intent','transform','translate(0 '+mix(0,-360,p[2])+') rotate('+mix(0,-12,p[2])+')');set('person','transform','translate(0 '+mix(0,-20,p[2])+') rotate('+mix(0,-5,p[2])+')');
set('switch','opacity',p[3]);set('switch','transform','translate(0 '+mix(90,-10,p[3])+')');set('device','transform','translate('+mix(990,1160,p[3])+' '+mix(370,510,p[3])+') rotate('+mix(-9,18,p[3])+')');
set('notif','opacity',p[4]);set('tunnel','opacity',p[4]);set('tunnel','transform','scale('+mix(.65,1.25,p[4])+') rotate('+mix(0,25,p[4])+')');set('device','transform','translate('+mix(1160,800,p[4])+' '+mix(510,330,p[4])+') rotate('+mix(18,-30,p[4])+') scale('+mix(1,1.15,p[4])+')');set('person','transform','translate(0 '+mix(0,-80,p[4])+') rotate('+mix(0,10,p[4])+')');
set('notif','opacity',1-p[5]);set('tunnel','opacity',1-p[5]);set('switch','opacity',.35*(1-p[5]));set('device','transform','translate('+mix(800,1050,p[5])+' '+mix(330,430,p[5])+') rotate('+mix(-30,8,p[5])+') scale('+mix(1.15,1,p[5])+')');
set('tips','opacity',p[6]);set('tips','transform','translate(0 '+mix(100,0,p[6])+')');set('device','transform','translate('+mix(1050,1210,p[6])+' '+mix(430,300,p[6])+') rotate('+mix(8,0,p[6])+') scale('+mix(1,.86,p[6])+')');
set('device','transform','translate('+mix(1210,1330,p[7])+' '+mix(300,660,p[7])+') rotate('+mix(0,28,p[7])+') scale('+mix(.86,.7,p[7])+')');set('person','transform','translate(0 '+mix(0,35,p[7])+') rotate('+mix(0,-2,p[7])+')');set('final','opacity',p[7]);set('final','transform','scale('+mix(.72,1,p[7])+')');const drift=Math.sin(t*1.7)*7;attr('particles','transform','translate('+drift+' '+Math.cos(t*1.3)*8+')');
};
</script></body></html>
