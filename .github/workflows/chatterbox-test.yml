name: chatterbox-test
on: workflow_dispatch
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install chatterbox-tts
      - run: python tts_prepare.py prison_input.json > prepared.json
      - run: python chatterbox_fa_test.py prepared.json out_cb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatterbox-out
          path: out_cb
