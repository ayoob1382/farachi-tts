name: tts-test
on: workflow_dispatch
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python tts_prepare.py prison_input.json > prepared.json
      - run: python tts_edge.py prepared.json out
      - uses: actions/upload-artifact@v4
        with:
          name: tts-out
          path: out
