name: FARACHI — Spotlight Motion Test
on:
  push:
    branches: [feat/farachi-motion-skills]
    paths:
      - "tests/spotlight-motion/**"
      - ".github/workflows/spotlight-motion-test.yml"
  workflow_dispatch:
    inputs:
      tts_model:
        description: "همان مدل Gemini TTS در make-video"
        default: "gemini-3.8-flash-tts"
      workers:
        description: "تعداد پردازش موازی رندر"
        default: "4"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/farachi-motion-skills

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب ابزارها (همان make-video)
        run: |
          pip install numpy
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y fonts-vazirmatn || echo "فونت وزیرمتن نصب نشد، از فونت پیش‌فرض استفاده می‌شه"
          ffmpeg -version | head -1

      - name: ساخت صدا و زمان‌بندی (عین make-video)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ inputs.tts_model || 'gemini-3.8-flash-tts' }}
        run: |
          mkdir -p build
          python build_audio.py spotlight.json --out build

      - name: موزیک (عین make-video)
        run: |
          MUSIC=$(ls music/* 2>/dev/null | head -1 || true)
          if [ -z "$MUSIC" ]; then
            echo "موزیکی توی پوشه music پیدا نشد، موزیک موقت ساخته می‌شه"
            python make_music.py build/music.wav
            MUSIC=build/music.wav
          fi
          echo "$MUSIC" > build/music_path.txt
          echo "موزیک: $MUSIC"

      - name: رندر صحنه آزمایشی با همان timings.json
        run: |
          node render.js tests/spotlight-motion/spotlight.html build/silent.mp4 --dir build --workers "${{ inputs.workers || '4' }}"

      - name: ترکیب صدا، موزیک و تصویر (عین make-video)
        run: |
          python mix.py build/timings.json build/voice.wav "$(cat build/music_path.txt)" build/silent.mp4 build/final.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of default=nw=1 build/final.mp4
          ffmpeg -hide_banner -i build/final.mp4 -af volumedetect -vn -f null - 2> build/audio-levels.txt
          cat build/audio-levels.txt | tail -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farachi-spotlight-same-tts-and-timing
          path: |
            build/final.mp4
            build/voice.wav
            build/timings.json
            build/audio-levels.txt
            tests/spotlight-motion/spotlight.html
          retention-days: 7
