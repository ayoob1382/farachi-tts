name: FARACHI — Spotlight Motion Test
on:
  push:
    branches: [feat/farachi-motion-skills]
    paths:
      - "tests/spotlight-motion/**"
      - ".github/workflows/spotlight-motion-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/farachi-motion-skills
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          pip install numpy
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-vazirmatn || true
      - name: Generate preview narration timeline (synthetic test voice)
        run: |
          mkdir -p build/spotlight
          python build_audio.py spotlight.json --out build/spotlight --fake
      - name: Render visual frames
        run: node render.js tests/spotlight-motion/spotlight.html build/spotlight/silent.mp4 --dir build/spotlight --fps 30 --workers 4
      - name: Create preview music
        run: python make_music.py build/spotlight/music.wav
      - name: Mix narration, music, and animation
        run: |
          python mix.py build/spotlight/timings.json build/spotlight/voice.wav build/spotlight/music.wav build/spotlight/silent.mp4 build/spotlight/final.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of default=nw=1 build/spotlight/final.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farachi-spotlight-motion-test
          path: |
            build/spotlight/final.mp4
            build/spotlight/timings.json
            tests/spotlight-motion/spotlight.html
          retention-days: 7
