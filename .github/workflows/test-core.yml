name: test-farachi-core

on:
  push:
    branches:
      - feat/farachi-motion-skills
    paths:
      - "farachi_core/**"
      - "schemas/**"
      - "tests/test_skill_manager.py"
      - ".github/workflows/test-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/farachi-motion-skills
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: python -m compileall -q farachi_core tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate project schema JSON
        run: python -m json.tool schemas/farachi-project.schema.json > /dev/null
