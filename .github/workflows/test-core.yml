name: test-farachi-core

on:
  push:
    branches:
      - feat/farachi-motion-skills
    paths:
      - "farachi_core/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/test-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/farachi-motion-skills
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: python -m compileall -q farachi_core tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate project schema JSON
        run: python -m json.tool schemas/farachi-project.schema.json > /dev/null
      - name: Run Quality Controller smoke audit
        run: python -m farachi_core.quality_controller examples/minimal-project.json --root . --json-out build/quality-report.json --md-out build/quality-report.md
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farachi-quality-report
          path: |
            build/quality-report.json
            build/quality-report.md
          if-no-files-found: ignore
