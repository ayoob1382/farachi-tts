name: audio-edit-test
on: workflow_dispatch
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python tts_prepare.py prison_input.json > prepared.json
      - run: python audio_edit.py prepared.json out_edit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edit-out
          path: out_edit
